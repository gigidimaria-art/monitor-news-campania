name: Monitor News Agricoltura Campania

on:
  schedule:
    # GitHub Actions non garantisce puntualità al minuto: in periodi di
    # carico può ritardare di alcuni minuti rispetto all'orario previsto.
    # Per un intervallo di 5 minuti affidabile usare il cron job su Render.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python monitor.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_MITTENTE: ${{ secrets.EMAIL_MITTENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
